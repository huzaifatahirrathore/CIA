name: CI Pipeline

on:
  push:
    branches: [huzaifa, dev-usama]
  pull_request:
    branches: [huzaifa]

jobs:
  # ─────────────────────────────────────────────
  # BACKEND
  # ─────────────────────────────────────────────
  backend-deps:
    name: Backend — Install Dependencies
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Verify all packages installed
        run: node -e "require('express'); require('typeorm'); require('jsonwebtoken'); console.log('All critical packages verified')"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: backend-node-${{ runner.os }}-${{ hashFiles('backend/package-lock.json') }}

  backend-lint:
    name: Backend — Lint
    runs-on: ubuntu-latest
    needs: backend-deps
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Check Prettier formatting
        run: npx prettier --check "src/**/*.ts" || true

      - name: Run TSLint
        run: npx tslint -p tsconfig.json "src/**/*.ts" || true

  backend-compile:
    name: Backend — TypeScript Compile
    runs-on: ubuntu-latest
    needs: backend-deps
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript compile check (no emit)
        run: npx tsc --noEmit

  backend-test:
    name: Backend — Unit Tests
    runs-on: ubuntu-latest
    needs: backend-compile
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      JWT_SECRET: ci-test-secret
      DB_HOST: localhost
      DB_PORT: 3306
      DB_USER: test_user
      DB_PASSWORD: test_pass
      DB_NAME: test_db

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: test_db
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run tests
        run: npm test

  # ─────────────────────────────────────────────
  # FRONTEND
  # ─────────────────────────────────────────────
  frontend-deps:
    name: Frontend — Install Dependencies
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify critical packages installed
        run: node -e "require('react'); require('react-dom'); require('redux'); console.log('All critical packages verified')"

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: frontend-node-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

  frontend-lint:
    name: Frontend — Lint
    runs-on: ubuntu-latest
    needs: frontend-deps
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint "src/**/*.{ts,tsx}" --max-warnings=0 || true

  frontend-compile:
    name: Frontend — TypeScript Compile
    runs-on: ubuntu-latest
    needs: frontend-deps
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript compile check
        run: npx tsc --noEmit

  frontend-test:
    name: Frontend — Unit Tests
    runs-on: ubuntu-latest
    needs: frontend-compile
    defaults:
      run:
        working-directory: frontend
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watchAll=false --passWithNoTests

  frontend-build:
    name: Frontend — Production Build
    runs-on: ubuntu-latest
    needs: [frontend-test, frontend-compile]
    defaults:
      run:
        working-directory: frontend
    env:
      CI: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build for production
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build/
          retention-days: 7

  # ─────────────────────────────────────────────
  # FINAL STATUS CHECK
  # ─────────────────────────────────────────────
  ci-status:
    name: CI — All Checks Passed
    runs-on: ubuntu-latest
    needs:
      - backend-test
      - backend-compile
      - frontend-test
      - frontend-build
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.backend-test.result }}" != "success" ]]; then
            echo "backend-test failed" && exit 1
          fi
          if [[ "${{ needs.backend-compile.result }}" != "success" ]]; then
            echo "backend-compile failed" && exit 1
          fi
          if [[ "${{ needs.frontend-test.result }}" != "success" ]]; then
            echo "frontend-test failed" && exit 1
          fi
          if [[ "${{ needs.frontend-build.result }}" != "success" ]]; then
            echo "frontend-build failed" && exit 1
          fi
          echo "All CI checks passed successfully!"
