version: '3'

services:
  db:
    image: mysql:5.7
    container_name: dev_db

    volumes:
      - db_data:/var/lib/mysql

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dev_db

    ports:
      - "3306:3306"

    networks:
      - backend

    # (OPTIONAL BUT IMPORTANT FOR STABILITY)
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    
    image: sample-express-app
    build: .

    restart: always

    environment:
      DB_HOST: db

    ports:
      - "3000:3000"

    networks:
      - backend

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - ./logs:/app/logs

networks:
  backend:
    driver: bridge

volumes:
  db_data: